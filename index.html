<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ragnar Magic 3D</title>
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:system-ui,sans-serif;
    color:white;
    touch-action:none;
}
#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}
#hud{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    z-index:10;
    pointer-events:none;
}
.panel{
    background:#101820cc;
    border:1px solid #ffffff25;
    border-radius:15px;
    padding:10px 13px;
    max-width:360px;
    backdrop-filter:blur(6px);
    box-shadow:0 4px 20px #0008;
}
.bar{
    height:10px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
    margin:4px 0 7px;
}
.hp{
    height:100%;
    width:100%;
    background:#e04b4b;
}
.xp{
    height:100%;
    width:0%;
    background:#4c8fe8;
}
#message{
    position:fixed;
    top:23%;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    font-size:18px;
    font-weight:700;
    text-shadow:0 2px 5px #000;
    pointer-events:none;
    text-align:center;
}
/* JOYSTICK */
#joystick{
    position:fixed;
    left:20px;
    bottom:22px;
    width:135px;
    height:135px;
    border-radius:50%;
    background:#ffffff16;
    border:2px solid #ffffff30;
    z-index:20;
}
#stick{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#ffffff45;
    left:38px;
    top:38px;
}
/* BOTÕES */
.controls{
    position:fixed;
    right:18px;
    bottom:24px;
    z-index:20;
    display:flex;
    gap:10px;
    align-items:end;
}
button{
    border:1px solid #ffffff35;
    color:white;
    background:#172238dd;
    border-radius:50%;
    width:70px;
    height:70px;
    font-weight:700;
    font-size:14px;
    box-shadow:0 4px 12px #0008;
}
#attack{
    width:88px;
    height:88px;
    font-size:26px;
    background:#633838ee;
}
#magic{
    background:#40386eee;
}
#run{
    background:#31533fee;
}
/* TELA INICIAL */
#start{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(#06120dcc,#000e);
}
.startCard{
    width:min(90%,430px);
    text-align:center;
    padding:28px;
    border-radius:22px;
    background:#101922ee;
    border:1px solid #ffffff25;
    box-shadow:0 10px 40px #000;
}
.startCard h1{
    font-size:38px;
    margin:0 0 8px;
}
.startCard p{
    color:#ccd5dc;
}
#startButton{
    width:100%;
    height:58px;
    border-radius:15px;
    margin-top:15px;
    background:#315d91;
    font-size:17px;
}
.hidden{
    display:none!important;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
    <div class="panel">
        <b>⚔️ Levi</b> · Nv <span id="level">1</span>
        <div>❤️ HP <span id="hpText">100 / 100</span></div>
        <div class="bar">
            <div id="hpbar" class="hp"></div>
        </div>
        <div>⭐ XP <span id="xpText">0 / 100</span></div>
        <div class="bar">
            <div id="xpbar" class="xp"></div>
        </div>
        <div>🐺 Lobo Cinzento: <span id="wolfText">45 / 45</span></div>
    </div>
</div>
<div id="message"></div>
<div id="joystick">
    <div id="stick"></div>
</div>
<div class="controls">
    <button id="run">🏃<br>Correr</button>
    <button id="magic">✨<br>Magia</button>
    <button id="attack">⚔️</button>
</div>
<div id="start">
    <div class="startCard">
        <h1>Ragnar Magic</h1>
        <p>🌲 As terras de Elarin</p>
        <p>🐺 O Lobo Cinzento está esperando...</p>
        <button id="startButton">ENTRAR NO MUNDO</button>
    </div>
</div>
<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* =========================================================
   CONFIGURAÇÃO
========================================================= */
const canvas = document.getElementById("game");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b9d8);
scene.fog = new THREE.Fog(
    0x87b9d8,
    45,
    180
);
/* =========================================================
   CÂMERA
========================================================= */
const camera = new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    0.1,
    500
);
camera.position.set(0,8,12);
/* =========================================================
   RENDERIZADOR 3D
========================================================= */
const renderer = new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true
});
renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);
renderer.setSize(
    innerWidth,
    innerHeight
);
renderer.shadowMap.enabled = true;
/* =========================================================
   LUZ
========================================================= */
const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);
sun.position.set(
    40,
    70,
    30
);
sun.castShadow = true;
scene.add(sun);
const ambient = new THREE.HemisphereLight(
    0xbfe5ff,
    0x304020,
    1.4
);
scene.add(ambient);
/* =========================================================
   MUNDO
========================================================= */
const groundGeometry =
    new THREE.PlaneGeometry(
        300,
        300
    );
const groundMaterial =
    new THREE.MeshStandardMaterial({
        color:0x315f32
    });
const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
/* =========================================================
   ESTRADA
========================================================= */
const roadGeometry =
    new THREE.PlaneGeometry(
        12,
        300
    );
const roadMaterial =
    new THREE.MeshStandardMaterial({
        color:0x927651
    });
const road =
    new THREE.Mesh(
        roadGeometry,
        roadMaterial
    );
road.rotation.x = -Math.PI / 2;
road.position.y = 0.01;
scene.add(road);
/* =========================================================
   ÁRVORES
========================================================= */
function createTree(x,z){
    const group = new THREE.Group();
    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.35,
                0.5,
                3,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x69452d
            })
        );
    trunk.position.y = 1.5;
    trunk.castShadow = true;
    group.add(trunk);
    const leaves =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                2.4,
                5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x1d5b2c
            })
        );
    leaves.position.y = 5;
    leaves.castShadow = true;
    group.add(leaves);
    group.position.set(x,0,z);
    scene.add(group);
}
/* floresta */
for(let i=0;i<70;i++){
    let x =
        (Math.random()-0.5)*180;
    let z =
        (Math.random()-0.5)*180;
    if(Math.abs(x)<15){
        x += 25;
    }
    createTree(x,z);
}
/* =========================================================
   PEDRAS
========================================================= */
function createRock(x,z){
    const rock =
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                1 + Math.random()*1.3
            ),
            new THREE.MeshStandardMaterial({
                color:0x555b59
            })
        );
    rock.position.set(
        x,
        0.8,
        z
    );
    rock.scale.y =
        0.6 + Math.random()*0.5;
    rock.castShadow = true;
    scene.add(rock);
}
for(let i=0;i<30;i++){
    createRock(
        (Math.random()-0.5)*180,
        (Math.random()-0.5)*180
    );
}
/* =========================================================
   PERSONAGEM
========================================================= */
const player =
    new THREE.Group();
scene.add(player);
function createPlayer(){
    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                0.65,
                1.4,
                6,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x3566a5
            })
        );
    body.position.y = 1.5;
    body.castShadow = true;
    player.add(body);
    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.55,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0xd6a47c
            })
        );
    head.position.y = 2.8;
    head.castShadow = true;
    player.add(head);
    const sword =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.12,
                1.5,
                0.22
            ),
            new THREE.MeshStandardMaterial({
                color:0xd9d9d9,
                metalness:0.7
            })
        );
    sword.position.set(
        0.9,
        1.4,
        0
    );
    sword.rotation.z =
        -0.35;
    sword.castShadow = true;
    player.add(sword);
}
createPlayer();
player.position.set(
    0,
    0,
    5
);
/* =========================================================
   LOBO
========================================================= */
const wolf =
    new THREE.Group();
scene.add(wolf);
function createWolf(){
    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                0.75,
                1.5,
                6,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x70777f
            })
        );
    body.rotation.z =
        Math.PI/2;
    body.position.y = 1.15;
    body.castShadow = true;
    wolf.add(body);
    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.65,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0x7b8188
            })
        );
    head.position.set(
        1.0,
        1.45,
        0
    );
    head.castShadow = true;
    wolf.add(head);
    const ear1 =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                0.25,
                0.65,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:0x626870
            })
        );
    ear1.position.set(
        1.05,
        2.1,
        -0.35
    );
    wolf.add(ear1);
    const ear2 =
        ear1.clone();
    ear2.position.z =
        0.35;
    wolf.add(ear2);
}
createWolf();
wolf.position.set(
    0,
    0,
    -12
);
/* =========================================================
   STATUS
========================================================= */
let playerHP = 100;
let playerMaxHP = 100;
let wolfHP = 45;
let wolfMaxHP = 45;
let xp = 0;
let nextXP = 100;
let level = 1;
let attackCooldown = 0;
let magicCooldown = 0;
let running = false;
let gameStarted = false;
/* =========================================================
   JOYSTICK
========================================================= */
const joystick =
    document.getElementById("joystick");
const stick =
    document.getElementById("stick");
const joy = {
    active:false,
    x:0,
    y:0
};
function joystickMove(e){
    if(!joy.active)return;
    const rect =
        joystick.getBoundingClientRect();
    const centerX =
        rect.left + rect.width/2;
    const centerY =
        rect.top + rect.height/2;
    let dx =
        e.clientX-centerX;
    let dy =
        e.clientY-centerY;
    const max = 45;
    const length =
        Math.hypot(dx,dy);
    if(length>max){
        dx =
            dx/length*max;
        dy =
            dy/length*max;
    }
    joy.x =
        dx/max;
    joy.y =
        dy/max;
    stick.style.left =
        (38+dx)+"px";
    stick.style.top =
        (38+dy)+"px";
}
function joystickEnd(){
    joy.active=false;
    joy.x=0;
    joy.y=0;
    stick.style.left="38px";
    stick.style.top="38px";
}
joystick.addEventListener(
    "pointerdown",
    e=>{
        joy.active=true;
        joystick.setPointerCapture(e.pointerId);
        joystickMove(e);
    }
);
joystick.addEventListener(
    "pointermove",
    joystickMove
);
joystick.addEventListener(
    "pointerup",
    joystickEnd
);
joystick.addEventListener(
    "pointercancel",
    joystickEnd
);
/* =========================================================
   ATAQUE
========================================================= */
function attack(){
    if(!gameStarted)return;
    if(attackCooldown>0)return;
    attackCooldown=0.55;
    const distance =
        player.position.distanceTo(
            wolf.position
        );
    if(distance<5){
        const damage =
            10 + Math.floor(level*2);
        wolfHP -= damage;
        message(
            "⚔️ Ataque! -" +
            damage +
            " HP"
        );
        wolf.children.forEach(
            obj=>{
                obj.scale.set(
                    1.2,
                    1.2,
                    1.2
                );
            }
        );
        setTimeout(()=>{
            wolf.children.forEach(
                obj=>{
                    obj.scale.set(
                        1,
                        1,
                        1
                    );
                }
            );
        },120);
        if(wolfHP<=0){
            wolfHP=0;
            gainXP(50);
            message(
                "🏆 Lobo derrotado! +50 XP"
            );
            setTimeout(()=>{
                wolf.position.set(
                    20,
                    0,
                    -20
                );
                wolfHP=wolfMaxHP;
            },2500);
        }
    }else{
        message(
            "🐺 Aproxime-se do lobo."
        );
    }
}
/* =========================================================
   MAGIA
========================================================= */
function magic(){
    if(!gameStarted)return;
    if(magicCooldown>0)return;
    magicCooldown=2;
    const distance =
        player.position.distanceTo(
            wolf.position
        );
    if(distance<12){
        wolfHP -= 18;
        message(
            "✨ MAGIA! -18 HP"
        );
        if(wolfHP<=0){
            wolfHP=0;
            gainXP(50);
            message(
                "🔥 O lobo foi derrotado!"
            );
            setTimeout(()=>{
                wolf.position.set(
                    20,
                    0,
                    -20
                );
                wolfHP=wolfMaxHP;
            },2500);
        }
    }else{
        message(
            "✨ O lobo está longe demais."
        );
    }
}
/* =========================================================
   EXPERIÊNCIA
========================================================= */
function gainXP(amount){
    xp += amount;
    if(xp>=nextXP){
        xp -= nextXP;
        level++;
        nextXP =
            Math.floor(
                nextXP*1.35
            );
        playerMaxHP += 15;
        playerHP =
            playerMaxHP;
        message(
            "⭐ NÍVEL "+level+"!"
        );
    }
}
/* =========================================================
   MENSAGENS
========================================================= */
let messageTimer;
function message(text){
    const el =
        document.getElementById(
            "message"
        );
    el.textContent=text;
    clearTimeout(messageTimer);
    messageTimer =
        setTimeout(()=>{
            el.textContent="";
        },1800);
}
/* =========================================================
   IA DO LOBO
========================================================= */
let wolfAttackCooldown=0;
function updateWolf(dt){
    const distance =
        player.position.distanceTo(
            wolf.position
        );
    wolfAttackCooldown -= dt;
    if(distance<25){
        if(distance>3){
            const direction =
                new THREE.Vector3()
                .subVectors(
                    player.position,
                    wolf.position
                )
                .normalize();
            wolf.position.add(
                direction.multiplyScalar(
                    3.5*dt
                )
            );
            wolf.lookAt(
                player.position.x,
                wolf.position.y,
                player.position.z
            );
        }
        if(
            distance<4 &&
            wolfAttackCooldown<=0
        ){
            wolfAttackCooldown=1.2;
            playerHP-=6;
            message(
                "🐺 O lobo atacou! -6 HP"
            );
            if(playerHP<=0){
                playerHP=playerMaxHP;
                player.position.set(
                    0,
                    0,
                    5
                );
                wolf.position.set(
                    0,
                    0,
                    -12
                );
                message(
                    "💀 Você foi derrotado!"
                );
            }
        }
    }
}
/* =========================================================
   MOVIMENTO
========================================================= */
function updatePlayer(dt){
    const magnitude =
        Math.hypot(
            joy.x,
            joy.y
        );
    if(magnitude<0.05)return;
    let speed =
        running ? 10 : 5;
    const dx =
        joy.x*speed*dt;
    const dz =
        joy.y*speed*dt;
    player.position.x += dx;
    player.position.z += dz;
    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -140,
            140
        );
    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -140,
            140
        );
    player.rotation.y =
        Math.atan2(
            dx,
            dz
        );
}
/* =========================================================
   CÂMERA
========================================================= */
function updateCamera(){
    const target =
        new THREE.Vector3(
            player.position.x,
            2,
            player.position.z
        );
    const desired =
        new THREE.Vector3(
            player.position.x,
            7,
            player.position.z+12
        );
    camera.position.lerp(
        desired,
        0.08
    );
    camera.lookAt(target);
}
/* =========================================================
   HUD
========================================================= */
function updateHUD(){
    document.getElementById(
        "level"
    ).textContent=level;
    document.getElementById(
        "hpText"
    ).textContent=
        Math.max(
            0,
            Math.ceil(playerHP)
        )+
        " / "+
        playerMaxHP;
    document.getElementById(
        "hpbar"
    ).style.width=
        Math.max(
            0,
            playerHP/playerMaxHP*100
        )+"%";
    document.getElementById(
        "xpText"
    ).textContent=
        xp+" / "+nextXP;
    document.getElementById(
        "xpbar"
    ).style.width=
        (xp/nextXP*100)+"%";
    document.getElementById(
        "wolfText"
    ).textContent=
        wolfHP+" / "+wolfMaxHP;
}
/* =========================================================
   BOTÕES
========================================================= */
document
.getElementById("attack")
.addEventListener(
    "pointerdown",
    attack
);
document
.getElementById("magic")
.addEventListener(
    "pointerdown",
    magic
);
document
.getElementById("run")
.addEventListener(
    "pointerdown",
    ()=>{
        running=true;
    }
);
document
.getElementById("run")
.addEventListener(
    "pointerup",
    ()=>{
        running=false;
    }
);
document
.getElementById("run")
.addEventListener(
    "pointercancel",
    ()=>{
        running=false;
    }
);
/* =========================================================
   INICIAR
========================================================= */
document
.getElementById("startButton")
.addEventListener(
    "click",
    ()=>{
        document
        .getElementById("start")
        .classList.add("hidden");
        gameStarted=true;
        message(
            "🌲 Bem-vindo a Elarin!"
        );
    }
);
/* =========================================================
   LOOP DO JOGO
========================================================= */
const clock =
    new THREE.Clock();
function animate(){
    requestAnimationFrame(
        animate
    );
    const dt =
        Math.min(
            clock.getDelta(),
            0.033
        );
    if(gameStarted){
        attackCooldown =
            Math.max(
                0,
                attackCooldown-dt
            );
        magicCooldown =
            Math.max(
                0,
                magicCooldown-dt
            );
        updatePlayer(dt);
        updateWolf(dt);
        updateCamera();
        updateHUD();
    }
    renderer.render(
        scene,
        camera
    );
}
animate();
/* =========================================================
   REDIMENSIONAMENTO
========================================================= */
addEventListener(
    "resize",
    ()=>{
        camera.aspect =
            innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);
</script>
</body>
</html>

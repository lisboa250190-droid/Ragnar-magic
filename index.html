<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ragnar Magic 3D</title>
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:system-ui,sans-serif;
    color:#fff;
    touch-action:none;
}
#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}
#hud{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    z-index:10;
    pointer-events:none;
}
.panel{
    background:#101820dd;
    border:1px solid #ffffff30;
    border-radius:16px;
    padding:11px 14px;
    max-width:380px;
    backdrop-filter:blur(7px);
    box-shadow:0 5px 25px #0009;
}
.bar{
    height:10px;
    background:#222;
    border-radius:10px;
    overflow:hidden;
    margin:4px 0 7px;
}
.hp{
    height:100%;
    width:100%;
    background:#df4545;
}
.xp{
    height:100%;
    width:0%;
    background:#4c8de0;
}
#wolfbar{
    height:7px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
    margin-top:4px;
}
#wolfhp{
    height:100%;
    width:100%;
    background:#65bd63;
}
#message{
    position:fixed;
    top:23%;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    font-size:19px;
    font-weight:800;
    text-shadow:0 3px 7px #000;
    pointer-events:none;
    text-align:center;
}
#joystick{
    position:fixed;
    left:20px;
    bottom:22px;
    width:138px;
    height:138px;
    border-radius:50%;
    background:#ffffff17;
    border:2px solid #ffffff30;
    z-index:20;
}
#stick{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#ffffff48;
    left:39px;
    top:39px;
}
.controls{
    position:fixed;
    right:16px;
    bottom:22px;
    z-index:20;
    display:flex;
    gap:9px;
    align-items:end;
}
button{
    border:1px solid #ffffff35;
    color:white;
    background:#172238e8;
    border-radius:50%;
    width:70px;
    height:70px;
    font-weight:800;
    font-size:13px;
    box-shadow:0 5px 15px #0009;
}
#attack{
    width:92px;
    height:92px;
    font-size:27px;
    background:#633737ef;
}
#magic{
    background:#493b72ef;
}
#run{
    background:#31533fef;
}
#start{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(#06120ddd,#000e);
}
.startCard{
    width:min(90%,440px);
    text-align:center;
    padding:30px;
    border-radius:24px;
    background:#101923f5;
    border:1px solid #ffffff25;
    box-shadow:0 15px 50px #000;
}
.startCard h1{
    font-size:40px;
    margin:0 0 5px;
}
.startCard p{
    color:#d0d8df;
}
#startButton{
    width:100%;
    height:60px;
    border-radius:16px;
    margin-top:16px;
    background:#315f94;
    font-size:17px;
}
.hidden{
    display:none!important;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
    <div class="panel">
        <div>
            <b>⚔️ Levi</b>
            · Nv <span id="level">1</span>
            · ⭐ <span id="xpText">0 / 100</span>
        </div>
        <div>❤️ HP <span id="hpText">100 / 100</span></div>
        <div class="bar">
            <div id="hpbar" class="hp"></div>
        </div>
        <div>🐺 Lobo Cinzento · HP <span id="wolfText">60 / 60</span></div>
        <div id="wolfbar">
            <div id="wolfhp"></div>
        </div>
    </div>
</div>
<div id="message"></div>
<div id="joystick">
    <div id="stick"></div>
</div>
<div class="controls">
    <button id="run">🏃<br>Correr</button>
    <button id="magic">✨<br>Magia</button>
    <button id="attack">⚔️</button>
</div>
<div id="start">
    <div class="startCard">
        <h1>Ragnar Magic</h1>
        <p>🌲 As terras de Elarin</p>
        <p>🐺 O Lobo Cinzento está à sua espera.</p>
        <button id="startButton">
            ENTRAR NO MUNDO
        </button>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ============================================================
   CENA
============================================================ */
const canvas=document.getElementById("game");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x82b4d0);
scene.fog=new THREE.Fog(
    0x82b4d0,
    35,
    190
);
/* ============================================================
   CÂMERA
============================================================ */
const camera=new THREE.PerspectiveCamera(
    58,
    innerWidth/innerHeight,
    0.1,
    500
);
camera.position.set(
    0,
    7,
    12
);
/* ============================================================
   RENDER
============================================================ */
const renderer=new THREE.WebGLRenderer({
    canvas,
    antialias:true
});
renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);
renderer.setSize(
    innerWidth,
    innerHeight
);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;
/* ============================================================
   ILUMINAÇÃO
============================================================ */
const sun=new THREE.DirectionalLight(
    0xfff1d2,
    2.4
);
sun.position.set(
    40,
    70,
    25
);
sun.castShadow=true;
sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;
sun.shadow.camera.left=-80;
sun.shadow.camera.right=80;
sun.shadow.camera.top=80;
sun.shadow.camera.bottom=-80;
scene.add(sun);
const hemi=new THREE.HemisphereLight(
    0xb9e3ff,
    0x26381f,
    1.5
);
scene.add(hemi);
/* ============================================================
   CHÃO
============================================================ */
const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(
        320,
        320
    ),
    new THREE.MeshStandardMaterial({
        color:0x356d38,
        roughness:1
    })
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);
/* ============================================================
   CAMINHO
============================================================ */
const path=new THREE.Mesh(
    new THREE.PlaneGeometry(

    ),
    new THREE.MeshStandardMaterial({

    })
);
path.rotation.x=-Math.PI/2;
path.position.y=.015;
scene.add(path);
/* ============================================================
   GRUPO DE FLORESTA
============================================================ */
function createTree(x,z,scale=1){
    const tree=new THREE.Group();
    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .35,
            .55,
            3.2,
            9
        ),
        new THREE.MeshStandardMaterial({
            color:0x67462e
        })
    );
    trunk.position.y=1.6;
    trunk.castShadow=true;
    tree.add(trunk);
    const crown1=new THREE.Mesh(
        new THREE.ConeGeometry(
            2.5,
            5,
            9
        ),
        new THREE.MeshStandardMaterial({
            color:0x1d5d2d
        })
    );
    crown1.position.y=5;
    crown1.castShadow=true;
    tree.add(crown1);
    const crown2=new THREE.Mesh(
        new THREE.ConeGeometry(
            1.9,
            3.8,
            9
        ),
        new THREE.MeshStandardMaterial({
            color:0x26733a
        })
    );
    crown2.position.y=7.2;
    crown2.castShadow=true;
    tree.add(crown2);
    tree.position.set(x,0,z);
    tree.scale.setScalar(scale);
    scene.add(tree);
}
/* ============================================================
   FLORESTA
============================================================ */
for(let i=0;i<100;i++){
    let x=(Math.random()-.5)*250;
    let z=(Math.random()-.5)*250;
    if(Math.abs(x)<18){
        x+=Math.sign(x||1)*25;
    }
    createTree(
        x,
        z,
        .7+Math.random()*.8
    );
}
/* ============================================================
   PEDRAS
============================================================ */
function createRock(x,z){
    const rock=new THREE.Mesh(
        new THREE.DodecahedronGeometry(
            .7+Math.random()*1.4

            color:0x5d625f,

    );

        x,
        .6,
        z
    );
    rock.scale.y=.55;
    rock.rotation.y=Math.random()*6;
    rock.castShadow=true;
    rock.receiveShadow=true;
    scene.add(rock);
}
for(let i=0;i<45;i++){

        (Math.random()-.5)*230,

/* ============================================================

    const shoulderR=shoulderL.clone();

    /* braços */
    const armMat=
        new THREE.MeshStandardMaterial({
            color:0x2d4f7c

    const armL=new THREE.Mesh(
        new THREE.CapsuleGeometry(

    /* pescoço */

    head.position.y=3.1;

    /* cabelo */

            Math.PI*2,

            color:0x17191c

createPlayer();
player.position.set(
    0,
    0,
    6
);
/* ============================================================
   LOBO CINZENTO
============================================================ */
const wolf=new THREE.Group();
scene.add(wolf);
const wolfParts={};
function createWolf(){
    const fur=new THREE.MeshStandardMaterial({
        color:0x747b83,
        roughness:1
    });
    const darkFur=new THREE.MeshStandardMaterial({
        color:0x4c5259,
        roughness:1
    });
    /* corpo */
    const body=new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .75,
            1.9,
            8,
            14
        ),
        fur
    );
    body.rotation.z=Math.PI/2;
    body.position.y=1.25;
    body.castShadow=true;
    wolf.add(body);
    wolfParts.body=body;
    /* peito */
    const chest=new THREE.Mesh(
        new THREE.SphereGeometry(
            .78,
            16,
            12
        ),
        darkFur
    );
    chest.scale.set(
        .8,
        1,
        .7
    );
    chest.position.set(
        .75,
        1.35,
        0
    );
    chest.castShadow=true;
    wolf.add(chest);
    /* cabeça */
    const head=new THREE.Mesh(
        new THREE.SphereGeometry(
            .7,
            18,
            14
        ),
        fur
    );
    head.scale.set(
        1.15,
        .95,
        .9
    );
    head.position.set(
        1.55,
        1.65,
        0
    );
    head.castShadow=true;
    wolf.add(head);
    wolfParts.head=head;
    /* focinho */
    const muzzle=new THREE.Mesh(
        new THREE.SphereGeometry(
            .35,
            14,
            10
        ),
        darkFur
    );
    muzzle.scale.set(
        1.25,
        .7,
        .8
    );
    muzzle.position.set(
        2.1,
        1.47,
        0
    );
    wolf.add(muzzle);
    /* nariz */
    const nose=new THREE.Mesh(
        new THREE.SphereGeometry(
            .15,
            10,
            10
        ),
        new THREE.MeshStandardMaterial({
            color:0x111111
        })
    );
    nose.position.set(
        2.45,
        1.52,
        0
    );
    wolf.add(nose);
    /* orelhas */
    function ear(z){
        const e=new THREE.Mesh(
            new THREE.ConeGeometry(
                .32,
                .85,
                5
            ),
            darkFur
        );
        e.position.set(
            1.4,
            2.35,
            z
        );
        e.rotation.x=
            z>0 ? -.25 : .25;
        e.castShadow=true;
        wolf.add(e);
    }
    ear(-.38);
    ear(.38);
    /* olhos */
    const eyeMat=
        new THREE.MeshStandardMaterial({
            color:0x141414
        });
    const eyeL=new THREE.Mesh(
        new THREE.SphereGeometry(
            .09,
            8,
            8
        ),
        eyeMat
    );
    eyeL.position.set(
        2.02,
        1.82,
        -.42
    );
    wolf.add(eyeL);
    const eyeR=eyeL.clone();
    eyeR.position.z=.42;
    wolf.add(eyeR);
    /* pernas */
    const legPositions=[
        [-.55,-.42],
        [-.55,.42],
        [.7,-.42],
        [.7,.42]
    ];
    wolfParts.legs=[];
    for(const pos of legPositions){
        const leg=new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .2,
                .85,
                5,
                8
            ),
            fur
        );
        leg.position.set(
            pos[0],
            .65,
            pos[1]
        );

        wolf.add(leg);
        wolfParts.legs.push(leg);
    }
    /* cauda */
    const tail=new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .22,
            1.5,
            6,
            10
        ),
        fur
    );
    tail.position.set(
        -1.25,
        1.55,
        0
    );
    tail.rotation.z=-.8;
    tail.rotation.y=.1;
    tail.castShadow=true;
    wolf.add(tail);
    wolfParts.tail=tail;
    /* coleira */
    const collar=new THREE.Mesh(
        new THREE.TorusGeometry(
            .66,
            .08,
            8,
            20
        ),
        new THREE.MeshStandardMaterial({
            color:0x8c632a,
            metalness:.4
        })
    );
    collar.rotation.x=Math.PI/2;
    collar.position.set(
        1.45,
        1.6,
        0
    );
    wolf.add(collar);
}

wolf.position.set(
    0,

/* ============================================================
   STATUS
============================================================ */
let playerHP=100;
let playerMaxHP=100;
let wolfHP=60;
let wolfMaxHP=60;
let xp=0;
let nextXP=100;
let level=1;
let attackCooldown=0;
let magicCooldown=0;
let wolfAttackCooldown=0;
let running=false;
let gameStarted=false;
/* ============================================================
   JOYSTICK
============================================================ */
const joystick=
    document.getElementById("joystick");
const stick=
    document.getElementById("stick");
const joy={
    active:false,
    x:0,
    y:0
};
function joyMove(e){
    if(!joy.active)return;
    const r=
        joystick.getBoundingClientRect();
    const cx=
        r.left+r.width/2;
    const cy=
        r.top+r.height/2;
    let dx=e.clientX-cx;
    let dy=e.clientY-cy;
    const max=46;
    const len=
        Math.hypot(dx,dy);
    if(len>max){
        dx=dx/len*max;
        dy=dy/len*max;
    }
    joy.x=dx/max;
    joy.y=dy/max;
    stick.style.left=
        39+dx+"px";
    stick.style.top=
        39+dy+"px";
}
function joyEnd(){
    joy.active=false;
    joy.x=0;
    joy.y=0;
    stick.style.left="39px";
    stick.style.top="39px";
}
joystick.addEventListener(
    "pointerdown",
    e=>{
        joy.active=true;
        joystick.setPointerCapture(
            e.pointerId
        );
        joyMove(e);
    }
);
joystick.addEventListener(
    "pointermove",
    joyMove
);
joystick.addEventListener(
    "pointerup",
    joyEnd
);
joystick.addEventListener(
    "pointercancel",
    joyEnd
);
/* ============================================================
   ATAQUE
============================================================ */
function attack(){
    if(!gameStarted)return;
    if(attackCooldown>0)return;
    attackCooldown=.65;
    const distance=
        player.position.distanceTo(
            wolf.position
        );
    if(distance<5.3){
        const damage=
            12+level*2;
        wolfHP-=damage;
        message(
            "⚔️ Ataque! -" +
            damage +
            " HP"
        );
        /* animação da espada */
        playerParts.sword.rotation.x=-1.3;
        setTimeout(()=>{
            playerParts.sword.rotation.x=.15;
        },180);
        /* recuo do lobo */
        const push=
            new THREE.Vector3()
            .subVectors(
                wolf.position,
                player.position
            )
            .normalize();
        wolf.position.add(
            push.multiplyScalar(.8)
        );
        if(wolfHP<=0){
            wolfHP=0;
            gainXP(60);
            message(
                "🏆 Lobo derrotado! +60 XP"
            );
            setTimeout(()=>{
                wolf.position.set(
                    0,
                    0,
                    -13
                );
                wolfHP=wolfMaxHP;
            },3000);
        }
    }else{
        message(
            "🐺 Aproxime-se do lobo."
        );
    }
}
/* ============================================================
   MAGIA
============================================================ */
function magic(){
    if(!gameStarted)return;
    if(magicCooldown>0)return;
    magicCooldown=2;
    const distance=
        player.position.distanceTo(
            wolf.position
        );
    if(distance<13){
        wolfHP-=20;
        createMagicEffect();
        message(
            "✨ MAGIA! -20 HP"
        );
        if(wolfHP<=0){
            wolfHP=0;
            gainXP(60);
            message(
                "🔥 O Lobo Cinzento caiu!"
            );
            setTimeout(()=>{
                wolf.position.set(
                    0,
                    0,
                    -13
                );
                wolfHP=wolfMaxHP;
            },3000);
        }
    }else{
        createMagicEffect();
        message(
            "✨ A magia foi lançada!"
        );
    }
}
/* ============================================================
   EFEITO DE MAGIA
============================================================ */
function createMagicEffect(){
    const geometry=
        new THREE.SphereGeometry(
            .35,
            12,
            12
        );
    const material=
        new THREE.MeshBasicMaterial({
            color:0x8e6cff
        });
    const orb=
        new THREE.Mesh(
            geometry,
            material
        );
    orb.position.copy(
        player.position
    );
    orb.position.y=2;
    scene.add(orb);
    let t=0;
    function animateMagic(){
        t+=.06;
        orb.position.z-=.5;
        orb.scale.setScalar(
            1+Math.sin(t*8)*.25
        );
        if(t<1.5){
            requestAnimationFrame(
                animateMagic
            );
        }else{
            scene.remove(orb);
        }
    }
    animateMagic();
}
/* ============================================================
   XP
============================================================ */
function gainXP(amount){
    xp+=amount;
    while(xp>=nextXP){
        xp-=nextXP;
        level++;
        nextXP=
            Math.floor(
                nextXP*1.35
            );
        playerMaxHP+=15;
        playerHP=
            playerMaxHP;
        message(
            "⭐ NÍVEL "+level+"!"
        );
    }
}
/* ============================================================
   MOVIMENTO DO PERSONAGEM
============================================================ */
function updatePlayer(dt){
    const magnitude=
        Math.hypot(
            joy.x,
            joy.y
        );
    if(magnitude<.05){
        playerParts.leftLeg.rotation.x*=.85;
        playerParts.rightLeg.rotation.x*=.85;
        return;
    }
    const speed=
        running ? 9 : 5;
    const dx=
        joy.x*speed*dt;
    const dz=
        joy.y*speed*dt;
    player.position.x+=dx;
    player.position.z+=dz;
    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -140,
            140
        );
    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -140,
            140
        );
    player.rotation.y=
        Math.atan2(
            dx,
            dz
        );
    /* animação das pernas */
    const time=
        performance.now()*.012;
    playerParts.leftLeg.rotation.x=
        Math.sin(time)*.45;
    playerParts.rightLeg.rotation.x=
        -Math.sin(time)*.45;
    playerParts.armL.rotation.x=
        -Math.sin(time)*.35;
    playerParts.armR.rotation.x=
        Math.sin(time)*.35;
}
/* ============================================================
   IA DO LOBO
============================================================ */
function updateWolf(dt){
    const distance=
        player.position.distanceTo(
            wolf.position
        );
    wolfAttackCooldown-=dt;
    if(distance<30){
        if(distance>3.5){
            const direction=
                new THREE.Vector3()
                .subVectors(
                    player.position,
                    wolf.position
                )
                .normalize();
            wolf.position.add(
                direction.multiplyScalar(
                    3.4*dt
                )
            );
            wolf.lookAt(
                player.position.x,
                wolf.position.y,
                player.position.z
            );
            /* animação das pernas */
            const time=
                performance.now()*.018;
            wolfParts.legs[0].rotation.x=
                Math.sin(time)*.5;
            wolfParts.legs[1].rotation.x=
                -Math.sin(time)*.5;
            wolfParts.legs[2].rotation.x=
                -Math.sin(time)*.5;
            wolfParts.legs[3].rotation.x=
                Math.sin(time)*.5;
            wolfParts.tail.rotation.z=
                -.8+
                Math.sin(time*1.5)*.15;
        }
        if(
            distance<4 &&
            wolfAttackCooldown<=0
        ){
            wolfAttackCooldown=1.15;
            playerHP-=7;
            message(
                "🐺 O lobo atacou! -7 HP"
            );
            if(playerHP<=0){
                playerHP=playerMaxHP;
                player.position.set(
                    0,
                    0,
                    6
                );
                wolf.position.set(
                    0,
                    0,
                    -13
                );
                message(
                    "💀 Você foi derrotado!"
                );
            }
        }
    }
}
/* ============================================================
   CÂMERA
============================================================ */
function updateCamera(){
    const target=
        new THREE.Vector3(
            player.position.x,
            2.1,
            player.position.z
        );
    const behind=
        new THREE.Vector3(
            0,
            7,
            12
        );
    behind.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        player.rotation.y
    );
    const desired=
        new THREE.Vector3(
            player.position.x+
            behind.x,
            7,
            player.position.z+
            behind.z
        );
    camera.position.lerp(
        desired,
        .08
    );
    camera.lookAt(target);
}
/* ============================================================
   HUD
============================================================ */
function updateHUD(){
    document.getElementById(
        "level"
    ).textContent=level;
    document.getElementById(
        "hpText"
    ).textContent=
        Math.max(
            0,
            Math.ceil(playerHP)
        )+
        " / "+
        playerMaxHP;
    document.getElementById(
        "hpbar"
    ).style.width=
        Math.max(
            0,
            playerHP/playerMaxHP*100
        )+"%";
    document.getElementById(
        "xpText"
    ).textContent=
        xp+" / "+nextXP;
    document.getElementById(
        "wolfText"
    ).textContent=
        Math.ceil(wolfHP)+
        " / "+
        wolfMaxHP;
    document.getElementById(
        "wolfhp"
    ).style.width=
        Math.max(
            0,
            wolfHP/wolfMaxHP*100
        )+"%";
}
/* ============================================================
   MENSAGEM
============================================================ */
let messageTimer;
function message(text){
    const el=
        document.getElementById(
            "message"
        );
    el.textContent=text;
    clearTimeout(messageTimer);
    messageTimer=
        setTimeout(()=>{
            el.textContent="";
        },1700);
}
/* ============================================================
   BOTÕES
============================================================ */
document
.getElementById("attack")
.addEventListener(
    "pointerdown",
    attack
);
document
.getElementById("magic")
.addEventListener(
    "pointerdown",
    magic
);
const runButton=
    document.getElementById("run");
runButton.addEventListener(
    "pointerdown",
    ()=>{
        running=true;
    }
);
runButton.addEventListener(
    "pointerup",
    ()=>{
        running=false;
    }
);
runButton.addEventListener(
    "pointercancel",
    ()=>{
        running=false;
    }
);
/* ============================================================
   INICIAR
============================================================ */
document
.getElementById("startButton")
.addEventListener(
    "click",
    ()=>{
        document
        .getElementById("start")
        .classList.add("hidden");
        gameStarted=true;
        message(
            "🌲 Bem-vindo às terras de Elarin!"
        );
    }
);
/* ============================================================
   LOOP
============================================================ */
const clock=
    new THREE.Clock();
function animate(){
    requestAnimationFrame(
        animate
    );
    const dt=
        Math.min(
            clock.getDelta(),
            .033
        );
    if(gameStarted){
        attackCooldown=
            Math.max(
                0,
                attackCooldown-dt
            );
        magicCooldown=
            Math.max(
                0,
                magicCooldown-dt
            );
        updatePlayer(dt);
        updateWolf(dt);
        updateCamera();
        updateHUD();
    }
    renderer.render(
        scene,
        camera
    );
}
animate();
/* ============================================================
   RESIZE
============================================================ */
addEventListener(
    "resize",
    ()=>{
        camera.aspect=
            innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);
</script>
</body>
</html>

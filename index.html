<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ragnar Magic</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    background:#07100b;
    font-family:Arial;
    font-size:20px;
    z-index:10;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    color:white;
    font-family:Arial;
    background:#101820cc;
    padding:12px;
    border-radius:12px;
}

#hp{
    width:200px;
    height:12px;
    background:#333;
    margin-top:5px;
    border-radius:10px;
    overflow:hidden;
}

#hpbar{
    width:100%;
    height:100%;
    background:#e33;
}

</style>

</head>

<body>

<div id="loading">
    Carregando Ragnar Magic...
</div>

<div id="hud">

    ⚔️ Levi<br>

    ❤️ HP

    <div id="hp">
        <div id="hpbar"></div>
    </div>

</div>

<canvas id="game"></canvas>


<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import {GLTFLoader} from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';


/* =========================
   CENA
========================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x87b7d1);


/* =========================
   CÂMERA
========================= */

const camera =
new THREE.PerspectiveCamera(
60,
innerWidth/innerHeight,
0.1,
500
);

camera.position.set(
0,
4,
8
);


/* =========================
   RENDER
========================= */

const renderer =
new THREE.WebGLRenderer({
canvas:document.getElementById("game"),
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;


/* =========================
   LUZ
========================= */

const sun =
new THREE.DirectionalLight(
0xffffff,
3
);

sun.position.set(
20,
40,
20
);

sun.castShadow=true;

scene.add(sun);


const ambient =
new THREE.HemisphereLight(
0xbfdfff,
0x304020,
2
);

scene.add(ambient);


/* =========================
   CHÃO
========================= */

const ground =
new THREE.Mesh(

new THREE.PlaneGeometry(
200,
200
),

new THREE.MeshStandardMaterial({
color:0x356b39
})

);

ground.rotation.x =
-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =========================
   CARREGAR LEVI
========================= */

const loader =
new GLTFLoader();

loader.load(

'./models/blackclothed.glb',

function(gltf){

    const levi =
    gltf.scene;

    levi.position.set(
    0,
    0,
    0
    );

    levi.scale.set(
    1,
    1,
    1
    );

    levi.traverse(
    function(obj){

        if(obj.isMesh){

            obj.castShadow=true;
            obj.receiveShadow=true;

        }

    });

    scene.add(levi);

    document
    .getElementById("loading")
    .style.display="none";

    console.log(
    "Levi carregado!",
    gltf
    );

},

undefined,

function(error){

    console.error(
    "Erro carregando modelo:",
    error
    );

    document
    .getElementById("loading")
    .textContent=
    "Erro ao carregar o personagem.";

});


/* =========================
   LOOP
========================= */

function animate(){

    requestAnimationFrame(
    animate
    );

    renderer.render(
    scene,
    camera
    );

}

animate();


/* =========================
   RESIZE
========================= */

addEventListener(
"resize",
function(){

    camera.aspect =
    innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
    innerWidth,
    innerHeight
    );

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ragnar Magic - Teste 3D</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07100b;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#status{
    position:fixed;
    top:20px;
    left:20px;
    right:20px;
    z-index:10;
    padding:15px;
    border-radius:12px;
    background:#101820dd;
    color:white;
    font-size:16px;
}
</style>
</head>

<body>

<div id="status">
    🔄 Iniciando motor 3D...
</div>

<canvas id="game"></canvas>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import {GLTFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


const status =
document.getElementById("status");

const canvas =
document.getElementById("game");


/* =========================
CENA
========================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x80b4d0);


/* =========================
CAMERA
========================= */

const camera =
new THREE.PerspectiveCamera(
50,
innerWidth/innerHeight,
0.1,
1000
);

camera.position.set(
0,
2,
8
);


/* =========================
RENDERER
========================= */

const renderer =
new THREE.WebGLRenderer({
canvas:canvas,
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;


/* =========================
LUZ
========================= */

const light =
new THREE.DirectionalLight(
0xffffff,
4
);

light.position.set(
5,
10,
5
);

scene.add(light);


const ambient =
new THREE.AmbientLight(
0xffffff,
2
);

scene.add(ambient);


/* =========================
CHÃO
========================= */

const floor =
new THREE.Mesh(

new THREE.PlaneGeometry(
100,
100
),

new THREE.MeshStandardMaterial({
color:0x39733d
})

);

floor.rotation.x =
-Math.PI/2;

scene.add(floor);


/* =========================
CARREGAR MODELO
========================= */

status.textContent =
"🔄 Procurando blackclothed.glb...";


const loader =
new GLTFLoader();


loader.load(

"./models/blackclothed.glb",

function(gltf){

    console.log(gltf);

    const model =
    gltf.scene;

    model.position.set(
    0,
    0,
    0
    );


    /*
    Descobrimos automaticamente
    o tamanho do modelo.
    */

    const box =
    new THREE.Box3()
    .setFromObject(model);

    const size =
    box.getSize(
    new THREE.Vector3()
    );

    const center =
    box.getCenter(
    new THREE.Vector3()
    );


    /*
    Centralizar personagem.
    */

    model.position.x -=
    center.x;

    model.position.z -=
    center.z;

    model.position.y -=
    box.min.y;


    /*
    Ajustar tamanho.
    */

    const maxSize =
    Math.max(
    size.x,
    size.y,
    size.z
    );

    const scale =
    3 / maxSize;

    model.scale.setScalar(
    scale
    );


    model.traverse(
    function(object){

        if(object.isMesh){

            object.castShadow=true;
            object.receiveShadow=true;

        }

    });


    scene.add(model);


    status.innerHTML =
    "✅ PERSONAGEM 3D CARREGADO!<br><br>" +
    "Agora você está vendo o modelo real.";

},

function(progress){

    if(progress.total){

        const percent =
        Math.round(
        progress.loaded /
        progress.total *
        100
        );

        status.textContent =
        "🔄 Carregando personagem: "+
        percent+"%";

    }

},

function(error){

    console.error(error);

    status.innerHTML =
    "❌ ERRO AO CARREGAR O MODELO.<br><br>" +
    "O arquivo foi encontrado, mas o navegador não conseguiu interpretá-lo.<br><br>" +
    "Abra o console do navegador para ver o erro.";

});


/* =========================
LOOP
========================= */

function animate(){

    requestAnimationFrame(
    animate
    );

    renderer.render(
    scene,
    camera
    );
}

animate();


/* =========================
RESIZE
========================= */

addEventListener(
"resize",
function(){

    camera.aspect =
    innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
    innerWidth,
    innerHeight
    );

});

</script>

</body>
</html>
